<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="João Ferreira — automação, sistemas web e integração de APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#060F26"/>
      <stop offset="1" stop-color="#0B1F4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="360" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { font-size: 13px; letter-spacing: 3px; fill: #FFFFFF; fill-opacity: 0.55; }
    .name  { font-size: 98px; font-weight: 800; letter-spacing: -3px; }
    .tag   { font-size: 21px; fill: #FFFFFF; fill-opacity: 0.9; }
    .cursor { animation: blink 1.1s steps(1) infinite; fill: #60A5FA; }
    .draw  { stroke-dasharray: 720; stroke-dashoffset: 0; animation: draw 1.8s ease-out 0.3s backwards; }
    .fade  { animation: fade 1s ease-out backwards; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.7s; } .d3 { animation-delay: 1.2s; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw  { from { stroke-dashoffset: 720; } }
    @keyframes fade  { from { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle class="pulse" cx="1010" cy="185" r="230" fill="url(#glow)"/>

    <!-- marcas de canto, estilo desenho técnico -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5">
      <path d="M40 62V40H62"/>
      <path d="M1138 40H1160V62"/>
      <path d="M40 298V320H62"/>
      <path d="M1138 320H1160V298"/>
    </g>

    <text class="mono label fade d1" x="72" y="58">JFRFILHO / README.MD</text>
    <text class="mono label fade d1" x="1128" y="58" text-anchor="end">MANAUS · AM · BR</text>

    <!-- nome: metade preenchida, metade em contorno -->
    <text class="sans name fade d1" x="68" y="200">
      <tspan fill="#FFFFFF">João</tspan>
      <tspan fill="none" stroke="#FFFFFF" stroke-width="1.6" dx="14">Ferreira</tspan>
    </text>

    <path class="draw" d="M72 228H790" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>

    <text class="mono tag fade d2" x="72" y="270">
      <tspan fill="#60A5FA">&gt;</tspan> automação · sistemas web · integração de APIs<tspan class="cursor" dx="6">▍</tspan>
    </text>

    <text class="mono label fade d3" x="72" y="314">PYTHON — FLASK — REACT — GOOGLE WORKSPACE</text>

    <!-- órbitas -->
    <g fill="none" stroke="#FFFFFF">
      <circle cx="1010" cy="185" r="112" stroke-opacity="0.18" stroke-width="1"/>
      <circle cx="1010" cy="185" r="84" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" from="0 1010 185" to="360 1010 185" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="185" r="56" stroke="#3B82F6" stroke-width="2" stroke-dasharray="90 262">
        <animateTransform attributeName="transform" type="rotate" from="360 1010 185" to="0 1010 185" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <circle cx="1010" cy="73" r="5" fill="#FFFFFF"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1010 185" to="360 1010 185" dur="18s" repeatCount="indefinite"/>
    </g>
    <text class="mono" x="1010" y="198" text-anchor="middle" font-size="38" font-weight="700" fill="#FFFFFF">{ }</text>
  </g>
</svg>
