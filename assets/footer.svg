<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" role="img" aria-label="Obrigado pela visita">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1F4B"/>
      <stop offset="0.5" stop-color="#060F26"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; fill: #60A5FA; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1200" height="110" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="110" rx="18" fill="url(#grid)"/>
  <text class="mono" x="72" y="63" font-size="18" fill="#FFFFFF" fill-opacity="0.9">
    <tspan fill="#60A5FA">&gt;</tspan> obrigado pela visita<tspan class="cursor" dx="6">▍</tspan>
  </text>
  <text class="mono" x="1128" y="63" text-anchor="end" font-size="13" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.55">FEITO EM MANAUS</text>
</svg>
